name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keystar
          POSTGRES_PASSWORD: keystar
          POSTGRES_DB: keystar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keystar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://keystar:keystar@localhost:5432/keystar_test
      APP_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Fails when the Drizzle schema has changes without a generated migration. drizzle-kit exits 0 even when it
      # stops at a rename prompt it can't show without a TTY, so the step also requires its "no changes" message.
      - name: Migrations match the schema
        run: |
          out=$(pnpm exec drizzle-kit generate 2>&1 </dev/null) || { echo "$out"; exit 1; }
          if ! grep -q "No schema changes, nothing to migrate" <<<"$out" || [ -n "$(git status --porcelain drizzle)" ]; then
            echo "$out"
            git status --porcelain drizzle
            echo "::error::The Drizzle schema has changes without a migration. Run \`pnpm db:generate --name <change>\` and commit the files in drizzle/."
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: keystar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
