name: Azure deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to activate (main deploys production)
        required: true
        default: main

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve branch without trusting shell input
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^[a-zA-Z0-9_./-]{1,200}$ ]] || exit 2
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          if [[ -n "$SOURCE_SHA" && "$sha" != "$SOURCE_SHA" ]]; then
            echo 'Skipping superseded commit'; exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keystar
          POSTGRES_PASSWORD: keystar
          POSTGRES_DB: keystar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keystar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://keystar:keystar@localhost:5432/keystar_test
      APP_SECRET: ci-secret-ci-secret-ci-secret-0123456789
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Manual activation also runs quality checks before any cloud credential is available.
      - run: pnpm lint && pnpm typecheck && pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/larsduewel/keystar-azure:sha-${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/larsduewel/Keystar
          cache-from: type=gha,scope=azure
          cache-to: type=gha,mode=max,scope=azure

  deploy:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.branch == 'main' && 'production' || 'staging' }}
    concurrency:
      group: azure-host-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      # This workflow runs from protected main; never execute deployment scripts from a preview branch.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy approved image and check health
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^[a-zA-Z0-9_./-]{1,200}$ ]] || exit 2
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          result=$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript --scripts "printf %s '$(base64 -w0 deploy/azure/deploy.sh)' | base64 -d >/opt/keystar/deploy-next; bash -n /opt/keystar/deploy-next && install -m 700 /opt/keystar/deploy-next /usr/local/sbin/keystar-deploy && /usr/local/sbin/keystar-deploy '$BRANCH' '$SHA'" -o json)
          message=$(jq -r '.value[].message' <<<"$result")
          echo "$message"
          url=$(grep -o 'DEPLOYMENT_URL=https://[^[:space:]]*' <<<"$message" | tail -1 | cut -d= -f2-)
          [[ -n "$url" ]] || { echo 'Deployment did not complete'; exit 1; }
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$BRANCH]($url) · $SHA" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 12); do
            if curl --retry 2 -fsS "$url/api/health" >/dev/null; then exit 0; fi
            sleep 10
          done
          exit 1
