# Publishes a release when started by hand (Actions → Release → Run workflow):
# takes the package.json version on main, checks that it has no tag yet and
# that CI passed on that commit, builds and pushes
# ghcr.io/<owner>/keystar:<version>, <major.minor> and latest, then creates the
# vX.Y.Z tag and GitHub release with the matching CHANGELOG.md section.
# :latest and :<major.minor> only move when the version is newer than every
# earlier release (or every earlier one in that minor line), so releasing an
# older line never moves them back.
# Merging to main releases nothing on its own. See docs/releasing.md.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
      minor_latest: ${{ steps.v.outputs.minor_latest }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main; run the workflow with \"Use workflow from: main\"."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          sha=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump \"version\" in package.json and date its CHANGELOG.md section on main first."
            exit 1
          fi
          passed=$(gh run list --workflow ci.yml --commit "$sha" --event push --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $sha (main) yet. Wait for it to finish, or fix it, and run Release again."
            exit 1
          fi
          # True when $version sorts above every existing tag matching the pattern.
          newest() {
            highest=$(git tag --list "$1" --sort=-v:refname | head -n1)
            [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "${highest#v}" "$version" | sort -V | tail -n1)" = "$version" ]
          }
          latest=false; newest 'v*' && latest=true
          minor_latest=false; newest "v${version%.*}.*" && minor_latest=true
          echo "Releasing v$version from $sha (latest: $latest, ${version%.*}: $minor_latest)."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "minor_latest=$minor_latest" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keystar" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          printf '\n---\n\n**Docker image:** `%s:%s`\n\n```bash\n# in .env: KEYSTAR_VERSION=%s\ndocker compose pull && docker compose up -d\n```\n' \
            "${{ steps.image.outputs.name }}" "$VERSION" "$VERSION" >> notes.md

      - name: Build date
        id: date
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ needs.check.outputs.minor_latest }}
            type=raw,value=latest,enable=${{ env.LATEST }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.SHA }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KEYSTAR_COMMIT=${{ env.SHA }}
            KEYSTAR_IMAGE_TAG=${{ env.VERSION }}
            KEYSTAR_BUILD_DATE=${{ steps.date.outputs.iso }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --target "$SHA" --title "Keystar v$VERSION" --notes-file notes.md --latest="$LATEST"
