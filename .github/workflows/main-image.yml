# Publishes the current main as ghcr.io/<owner>/keystar:main (and :sha-<commit>)
# after CI passed on it, for trying out unreleased changes. Releases (:latest
# and version tags) come only from the Release workflow. See docs/releasing.md.
name: Main image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: main-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    if: vars.ENABLE_MAIN_IMAGE == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Image name and tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keystar"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$name:main,$name:sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.version=main
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
